<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>En sus Zapatos</title><style>
:root{--bg:#101820;--panel:#192833;--line:#354956;--text:#f1f5f6;--muted:#bdcbd0;--mint:#9bd9ce;--gold:#f1ca7a;--violet:#d3b7f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}.shell{max-width:920px;margin:auto;padding:24px 18px 44px}header{text-align:center;padding:12px 0 22px}.eyebrow{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);font-weight:800}h1{font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.05;margin:8px 0}header p{max-width:660px;margin:12px auto;color:var(--muted)}.progress{display:flex;gap:6px;justify-content:center;margin:18px auto}.dot{height:5px;width:32px;background:#34444e;border-radius:9px}.dot.on{background:var(--mint)}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,36px);min-height:360px;box-shadow:0 18px 50px #0002}.kicker{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--gold)}h2{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.15;margin:8px 0 16px}p{color:#d7e1e4;margin:10px 0}.quote{border-left:3px solid var(--violet);padding:10px 0 10px 15px;margin:20px 0;color:#fff}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}.choice{cursor:pointer;text-align:left;background:#20343f;color:var(--text);border:1px solid #405965;border-radius:14px;padding:16px;line-height:1.45}.choice:hover,.choice:focus{border-color:var(--mint);outline:2px solid #9bd9ce33}.choice b{display:block;color:var(--mint);margin-bottom:5px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.btn{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font-weight:800;background:var(--mint);color:#10211f}.btn.alt{background:var(--violet);color:#21162c}.btn.ghost{background:#263a45;color:var(--text);border:1px solid var(--line)}.stat{margin-top:20px;padding:14px;background:#102029;border:1px solid var(--line);border-radius:13px}.statrow{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;color:var(--muted)}.bar{height:8px;background:#30424b;border-radius:20px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--mint);transition:width .3s}.panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:#13232c}.panel h3{margin:0 0 8px;color:var(--gold)}.small{font-size:.9rem;color:#aabcc2}.locked{opacity:.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}footer{text-align:center;color:#7f959d;font-size:.85rem;margin-top:20px}@media(max-width:620px){.choices,.grid{grid-template-columns:1fr}.shell{padding:14px 12px 32px}}
</style></head><body><div class="shell"><header><div class="eyebrow">Juego narrativo · tres perspectivas</div><h1>En sus Zapatos</h1><p>Una escena, tres historias. Descubre qué información cambia tu interpretación y si puedes encontrar una salida responsable para todos.</p><div class="progress" id="progress"></div></header><main id="game" class="card"></main><footer>Comprender el pasado ayuda a explicar una conducta; no borra sus consecuencias.</footer></div><script>
const state={unlocked:{},runs:[],best:10};let current='intro';
const chars={padre:{name:'Daniel · el padre',bio:'Daniel creció creyendo que debía resolver los problemas sin pedir ayuda. De adulto se enorgullece de cuidar de sus dos hijas y consiguió un empleo estable, aunque ahora pasa menos tiempo con ellas. Su mayor miedo es fallarles como su propio padre le falló a él. Cuando descubre que acabaron heridas, siente culpa y la transforma en rabia. Golpear a Lucía fue su decisión y debe asumirla.',first:'Al principio viste una agresión sin conocer lo que ocurrió antes.'},lucia:{name:'Lucía · la cuidadora',bio:'Lucía creció con poca atención y aprendió a ocultar los problemas para evitar que la abandonaran. Terminó un curso de cuidado infantil y estaba orgullosa de conseguir trabajo. Una deuda de alquiler la llevó a usar parte del dinero destinado a las niñas. Tras el accidente, tuvo miedo de perder el empleo y huyó. Su pasado ayuda a entender su pánico, pero no justifica poner a las niñas en riesgo ni mentir.',first:'Al principio solo pudiste observar su reacción y su miedo.'},ines:{name:'Inés · la agente',bio:'Al inicio de su carrera, Inés tardó en intervenir en una llamada y alguien acabó herido. Desde entonces teme que dudar tenga un coste. Es observadora y dedicada, pero esa experiencia la hace precipitarse cuando ve señales de violencia. Debe investigar sin dar por hecho lo que todavía no sabe.',first:'Al principio no sabías qué había visto la agente ni qué la impulsaba a actuar.'}};
const S={intro:{step:0,k:'La escena',title:'Lo que alcanzas a ver',text:'En una calle, dos personas discuten. Una habla deprisa; la otra aprieta la mandíbula. De pronto, una golpea a la otra. Estás cerca, pero no sabes qué ocurrió antes.',quote:'Solo has visto unos segundos. ¿Qué haces ahora?',opts:[['approach','Acercarte para entender','Mantener una distancia prudente y preguntar qué está pasando.'],['intervene','Actuar para detener la agresión','Pedir en voz alta que se detenga y buscar ayuda cercana.'],['leave','No intervenir directamente','Alejarte a un lugar seguro y pedir ayuda.']]},approach:{step:1,k:'Te acercas con cautela',title:'Dos versiones enfrentadas',text:'La persona herida se aparta y dice que quiere irse. La otra responde que necesita saber qué pasó con sus hijas. Ninguna parece dispuesta a escuchar a la otra; tú no sabes quiénes son ni cómo empezó la discusión.',quote:'Puedes seguir la versión de una persona, escuchar a la otra o fijarte en cómo interviene quien llega a ayudar.',opts:[['start_lucia','Escuchar a quien recibió el golpe','Conocer qué recuerda y qué teme en ese momento.'],['start_padre','Escuchar a quien dio el golpe','Averiguar qué le hizo perder el control, sin justificar la agresión.'],['start_ines','Observar a quien llega a intervenir','Ver cómo se intenta controlar una situación confusa.']]},intervene:{step:1,k:'Actúas para frenar la situación',title:'La tensión no desaparece',text:'Tu voz consigue que se separen unos pasos. La persona herida se lleva una mano al rostro; la otra repite que hay niñas involucradas. Alguien cercano llama a emergencias. Aún faltan datos para entender qué ocurrió.',quote:'Detener el peligro inmediato es importante; decidir quién tiene razón requiere más información.',opts:[['start_lucia','Comprobar cómo está la persona herida','Escucharla y procurar que esté a salvo.'],['start_padre','Pedirle a la otra persona que explique qué pasó','Escuchar su preocupación sin pasar por alto la agresión.'],['start_ines','Esperar a que llegue la ayuda','Observar cómo se organiza la intervención.']]},leave:{step:1,k:'Pides ayuda desde un lugar seguro',title:'La escena continúa',text:'Te alejas lo suficiente para estar a salvo y llamas para pedir ayuda. Desde allí ves que la discusión sigue tensa. Cuando llega una agente, mira primero a la persona herida y después a quien permanece cerca. No sabes qué información recibió por teléfono.',quote:'Pedir ayuda también es actuar. Ahora puedes observar distintas decisiones sin asumir que conoces sus motivos.',opts:[['start_lucia','Seguir lo que cuenta la persona herida','Descubrir qué vivió antes de la discusión.'],['start_padre','Escuchar a quien está alterado','Descubrir qué intenta explicar.'],['start_ines','Observar a la agente','Descubrir cómo decide actuar con información incompleta.']]},start_padre:{step:1,k:'Perspectiva de Daniel',title:'La preocupación por sus hijas',text:'Ahora sabes que el hombre se llama Daniel y que tiene dos hijas. Dice que las niñas acabaron en el hospital durante una salida y que necesita respuestas. Al hablar de ellas, su voz se quiebra; enseguida vuelve a enfadarse. Admite que golpeó a Lucía.',quote:'Su preocupación puede ser sincera, pero no justifica la agresión.',opts:[['padre_support','Ayudar a Daniel a explicar lo ocurrido','Pedir que aporte lo que sabe y que no se acerque a Lucía.'],['padre_lucia','Priorizar la seguridad de Lucía','Asegurarte de que pueda hablar sin intimidación.']]},start_lucia:{step:1,k:'Perspectiva de Lucía',title:'El temor de quien recibió el golpe',text:'La mujer se llama Lucía. Tiembla y dice que no quiere que Daniel se acerque. Al preguntarle por las niñas, se queda callada y pide tiempo antes de contar lo ocurrido. Todavía no sabes por qué discutían ni qué pasó durante la salida.',quote:'Su miedo merece atención; aún faltan hechos por comprobar.',opts:[['lucia_support','Ayudar a Lucía a ponerse a salvo','Darle espacio para contar su versión sin presión.'],['lucia_daniel','Pedir que también se escuche la preocupación de Daniel','Buscar respuestas sin exponerla a más violencia.']]},start_ines:{step:1,k:'Perspectiva de la agente',title:'Una intervención con pocos datos',text:'La agente se llama Inés. Encuentra a una persona herida y a otra muy alterada. Debe evitar que la situación escale, pero no vio el golpe ni conoce la discusión completa. Se acerca con rapidez y les pide que se separen.',quote:'Proteger a alguien y averiguar los hechos son tareas distintas, aunque ocurran al mismo tiempo.',opts:[['ines_act','Controlar la escena de inmediato','Separarlos primero y hacer preguntas después.'],['ines_check','Separarlos y escuchar por separado','Reducir el riesgo mientras comprueba lo ocurrido.']]},padre_support:{step:2,k:'Aparecen nuevos datos',title:'Escuchar no es encubrir',text:'Daniel explica que Lucía cuidaba a sus hijas. El hospital confirma que ambas fueron atendidas después de un accidente durante la salida. Lucía reconoce que usó parte del dinero destinado a la salida y que huyó. Daniel admite que la golpeó.',quote:'Ahora hay más contexto, pero cada decisión debe evaluarse por separado.',opts:[['end_padre','Decidir cómo seguir','Pedir una investigación, protección para Lucía y responsabilidad por la agresión.']]},padre_lucia:{step:2,k:'Aparecen nuevos datos',title:'Proteger sin ignorar los hechos',text:'Lucía cuenta que Daniel la golpeó y teme que vuelva a hacerlo. Al preguntarle por las niñas, reconoce que usó parte del dinero de la salida y huyó tras el accidente. Su relato merece protección y también una investigación justa.',quote:'Puedes proteger a Lucía sin negar el daño que causó.',opts:[['end_padre','Decidir cómo seguir','Pedir protección para Lucía y una investigación de lo ocurrido con las niñas.']]},lucia_support:{step:2,k:'Aparecen nuevos datos',title:'Entender el miedo',text:'Lucía cuenta que recibió un aviso de desalojo y usó parte del dinero de la salida para pagar el alquiler. Llevó a las niñas a un parque; una se cayó y ambas fueron atendidas. Asustada de perder el trabajo, huyó. Daniel admite que la golpeó.',quote:'Su situación explica parte de su pánico, pero las niñas necesitan cuidado y respuestas.',opts:[['end_lucia','Decidir cómo seguir','Asegurar apoyo, investigar el accidente y exigir responsabilidad sin violencia.']]},lucia_daniel:{step:2,k:'Aparecen nuevos datos',title:'Exigir respuestas sin intimidar',text:'Daniel explica que confió a Lucía el cuidado de sus hijas y el dinero para la salida. El hospital confirma que las niñas fueron atendidas. Lucía reconoce que huyó; Daniel reconoce que perdió el control y la golpeó.',quote:'Puedes exigir respuestas y proteger a Lucía de más violencia al mismo tiempo.',opts:[['end_lucia','Decidir cómo seguir','Pedir una investigación justa y medidas para que la agresión no se repita.']]},ines_act:{step:2,k:'Aparecen nuevos datos',title:'La urgencia y sus límites',text:'Inés separa a Daniel y lo retiene antes de escuchar ambas versiones. Después descubre que Daniel golpeó a Lucía y que Lucía huyó tras el accidente de las niñas. Recuerda que, al inicio de su carrera, tardó en actuar en una emergencia y alguien acabó herido; teme que vuelva a pasar.',quote:'Su experiencia ayuda a entender la prisa, pero no demuestra que toda decisión rápida sea correcta.',opts:[['end_ines','Decidir cómo seguir','Mantener la seguridad y revisar las pruebas antes de sacar conclusiones.']]},ines_check:{step:2,k:'Aparecen nuevos datos',title:'Actuar y comprobar',text:'Inés separa a ambos, comprueba que Lucía reciba atención y escucha sus versiones por separado. El hospital confirma que las niñas fueron atendidas. Daniel admite la agresión y Lucía reconoce que huyó después del accidente. Inés cuenta que una demora en una emergencia al inicio de su carrera le dejó miedo a esperar demasiado.',quote:'La calma no es pasividad: primero seguridad, después una investigación imparcial.',opts:[['end_ines','Decidir cómo seguir','Documentar los hechos, proteger a las personas y exigir responsabilidad.']]}};
function pct(id){return ({intro:10,start_padre:38,start_lucia:38,start_ines:35,padre_support:78,padre_lucia:82,lucia_support:78,lucia_daniel:82,ines_act:72,ines_check:88}[id]||state.best)}function dots(n){document.getElementById('progress').innerHTML=[0,1,2,3].map(i=>`<span class="dot ${i<=n?'on':''}"></span>`).join('')}
function render(id){current=id;if(!S[id])return summary(id.slice(4));const s=S[id],p=pct(id);state.best=Math.max(state.best,p);dots(s.step);document.getElementById('game').innerHTML=`<div class="kicker">${s.k}</div><h2>${s.title}</h2><p>${s.text}</p><div class="quote">${s.quote}</div><div class="choices">${s.opts.map(([n,l,d])=>`<button class="choice" data-next="${n}"><b>${l}</b>${d||''}</button>`).join('')}</div><div class="stat"><div class="statrow"><span>Información de esta ruta</span><strong>${p}%</strong></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><p class="small">${p>=70?'Has reunido suficiente información para desbloquear una posible solución.':'Sigue escuchando y comprobando detalles para conocer más de la situación.'}</p></div>`;document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{let n=b.dataset.next;if(n.startsWith('end_')){state.unlocked[n.slice(4)]=true;summary(n.slice(4))}else render(n)})}
function summary(path){current='summary';dots(3);let c=chars[path],visited=Object.keys(state.unlocked),all=visited.length===3;document.getElementById('game').innerHTML=`<div class="kicker">Ruta completada</div><h2>${c.name}</h2><p>Has terminado este recorrido con información suficiente para entender mejor la situación. Tus elecciones cambiaron a quién escuchaste primero, pero no borran los hechos ni las responsabilidades.</p><div class="quote">${c.first}</div><div class="panel"><h3>Tu recorrido</h3><p>${path==='padre'?'Miraste desde el miedo de un padre a fallar a sus hijas.':path==='lucia'?'Miraste desde el miedo de una cuidadora a perder su estabilidad.':'Miraste desde la presión de una policía que teme llegar tarde.'}</p><p class="small">Perspectivas desbloqueadas: ${visited.map(v=>chars[v].name.split(' · ')[0]).join(', ')}.</p></div>${state.best>=70?'<div class="actions"><button class="btn" id="solve">Desbloquear solución responsable</button></div>':''}<div class="grid">${Object.keys(chars).map(k=>`<div class="panel ${state.unlocked[k]?'':'locked'}"><h3>${state.unlocked[k]?chars[k].name:'Perspectiva bloqueada'}</h3><p>${state.unlocked[k]?chars[k].bio:'Completa esta ruta al menos una vez para descubrir su historia.'}</p></div>`).join('')}</div><div class="actions"><button class="btn alt" id="again">Recorrer otra perspectiva</button>${all?'<button class="btn ghost" id="reflect">Reflexión final</button>':''}</div>`;document.getElementById('again').onclick=()=>render('intro');let x=document.getElementById('solve');if(x)x.onclick=solution;let r=document.getElementById('reflect');if(r)r.onclick=reflection}
function solution(){dots(3);document.getElementById('game').innerHTML=`<div class="kicker">Desbloqueado · más del 70% de información</div><h2>Una salida responsable</h2><p>Una solución protege a todos sin borrar lo ocurrido.</p><div class="grid"><div class="panel"><h3>Lucía</h3><p>Recibe atención y protección. Debe explicar sus decisiones sobre las niñas, devolver el dinero que corresponda y asumir las consecuencias.</p></div><div class="panel"><h3>Daniel</h3><p>Puede participar en la investigación y atender a sus hijas. Debe responder por la agresión y no intimidar a Lucía.</p></div><div class="panel"><h3>Inés</h3><p>Separa a ambos, registra testimonios y pruebas y evita decidir culpabilidades antes de investigar.</p></div><div class="panel"><h3>Las niñas</h3><p>Reciben atención y un plan de cuidado seguro. Su bienestar no se usa para excusar la violencia ni para ignorar la responsabilidad de la niñera.</p></div></div><div class="quote">La empatía permite comprender; la responsabilidad permite reparar.</div><div class="actions"><button class="btn" id="back">Volver a las rutas</button><button class="btn alt" id="rf">Reflexión final</button></div>`;document.getElementById('back').onclick=()=>render('intro');document.getElementById('rf').onclick=reflection}
function reflection(){dots(3);document.getElementById('game').innerHTML=`<div class="kicker">Reflexión final</div><h2>¿Cambió tu primera impresión?</h2><p>Al principio viste una agresión, una discusión o una intervención policial. Ahora conoces miedos, logros y experiencias que influyeron en cada persona.</p><div class="quote">¿Ves a Daniel, Lucía e Inés igual que al principio? ¿Qué cambió al conocer su pasado? ¿Qué acciones siguen siendo responsabilidad de cada uno?</div><p>Conocer el contexto puede cambiar cómo interpretamos a alguien, pero no convierte el daño en algo aceptable.</p><div class="actions"><button class="btn" id="restart">Volver a empezar</button></div>`;document.getElementById('restart').onclick=()=>{state.unlocked={};state.best=10;render('intro')}}render('intro');
</script></body></html>
